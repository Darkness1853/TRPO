version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: python ./server.py
    ports:
      - "1234:1234"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: python ./client.py
    network_mode: host
    depends_on:
      - server